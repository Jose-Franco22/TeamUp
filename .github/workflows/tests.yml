name: Tests

# Runs every test suite on each pull request and on every push to main.
# Make "Tests" a required check (Settings → Branches → main) so a pull
# request can't merge while anything here is failing.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build still works
        run: npm run build

  resume-parsing:
    name: Resume parsing (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-parsing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            resume-parsing/package-lock.json
            frontend/package-lock.json
      # The parser re-exports code from frontend/src/lib/resume/, which
      # imports packages (e.g. chrono-node) from frontend/node_modules.
      - name: Install frontend dependencies the parser shares
        run: npm ci
        working-directory: frontend
      - run: npm ci
      - run: npm test

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install pgTAP into the Postgres container
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c \
            'apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap >/dev/null'
      - name: Build the database from supabase/*.sql and run the tests
        run: supabase/tests/run.sh
